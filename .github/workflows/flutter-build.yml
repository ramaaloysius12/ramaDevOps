name: Flutter CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Factory Reset Android Project
        working-directory: mobile_app
        run: |
          # 1. Hapus folder android lama yang rusak atau tidak cocok
          rm -rf android
          
          # 2. Buat ulang folder android yang 100% fresh menyesuaikan nama di pubspec.yaml
          flutter create --platforms=android .
          
          # 3. SOLUSI JITU: Naikkan batas minimum Android ke versi 8.0 (API 26)
          # Ini otomatis menonaktifkan kebutuhan "Desugaring" yang bikin error terus
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' android/app/build.gradle
          sed -i 's/minSdkVersion 21/minSdkVersion 26/g' android/app/build.gradle

      - name: Get Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Code
        working-directory: mobile_app
        run: flutter analyze || true

      - name: Build APK (Split per ABI)
        working-directory: mobile_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: mobile_app/build/app/outputs/flutter-apk/app-*-release.apk
