name: Flutter CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Factory Reset Android Project
        working-directory: mobile_app
        run: |
          rm -rf android
          flutter create --platforms=android .
          # Naikin SDK khusus buat aplikasi lu aja (Aman)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' android/app/build.gradle.kts

      - name: Get Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: BRUTE-FORCE Plugins SDK (Solusi Fix)
        run: |
          # Hajar semua package yang didownload sama server GitHub agar pindah ke SDK 36 paksa!
          # Cara ini murni meretas cache mesin tanpa ngerusak struktur folder kodingan lu
          find /home/runner/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdkVersion 3[0-9]/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdkVersion(3[0-9])/compileSdkVersion(36)/g' {} +
          find /home/runner/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' {} +
          find /home/runner/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdk = 3[0-9]/compileSdk = 36/g' {} +
          find /home/runner/.pub-cache -type f -name "build.gradle*" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' {} +

      - name: Analyze Code
        working-directory: mobile_app
        run: flutter analyze || true

      - name: Build APK (Split per ABI)
        working-directory: mobile_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: mobile_app/build/app/outputs/flutter-apk/app-*-release.apk
