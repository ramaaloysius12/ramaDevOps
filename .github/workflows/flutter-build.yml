name: Flutter CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Factory Reset & Fix MinSDK
        working-directory: mobile_app
        run: |
          # 1. Hapus dan buat ulang folder android
          rm -rf android
          flutter create --platforms=android .
          
          # 2. HANYA ubah minSdk menjadi 26 (tanpa menambah kode desugaring apapun)
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' android/app/build.gradle
          fi

      - name: Get Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Code
        working-directory: mobile_app
        run: flutter analyze || true

      - name: Build APK (Split per ABI)
        working-directory: mobile_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: mobile_app/build/app/outputs/flutter-apk/app-*-release.apk
