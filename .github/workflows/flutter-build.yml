name: Flutter CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # MENGKUTI SARAN ERROR: Buat project baru & pindahkan kode
      - name: Rebuild Fresh Project Structure
        run: |
          # 1. Buat project super bersih
          flutter create -t app clean_app --platforms=android --org com.hrdsystem.app
          
          # 2. Pindahkan semua hasil kerja keras Anda (kode, test, pubspec, .env) ke project baru
          cp -r mobile_app/lib clean_app/
          cp -r mobile_app/test clean_app/
          cp mobile_app/pubspec.yaml clean_app/
          cp mobile_app/.env clean_app/
          
          # 3. Buang folder lama yang error, dan jadikan folder baru sebagai yang utama
          rm -rf mobile_app
          mv clean_app mobile_app

      # MENGATASI ERROR NOTIFIKASI DENGAN CARA YANG AMAN (AWK)
      - name: Enable Core Library Desugaring (Safe Mode)
        working-directory: mobile_app
        run: |
          # Menyuntikkan aturan desugaring dengan sangat aman tanpa merusak baris lain
          awk '/compileOptions \{/ { print; print "        coreLibraryDesugaringEnabled true"; next }1' android/app/build.gradle > temp.gradle && mv temp.gradle android/app/build.gradle
          
          echo "" >> android/app/build.gradle
          echo "dependencies {" >> android/app/build.gradle
          echo "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'" >> android/app/build.gradle
          echo "}" >> android/app/build.gradle

      - name: Get Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Code
        working-directory: mobile_app
        run: flutter analyze || true

      - name: Build APK (Split per ABI)
        working-directory: mobile_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: mobile_app/build/app/outputs/flutter-apk/app-*-release.apk
