name: Flutter CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Factory Reset & Aktifkan Desugaring
        working-directory: mobile_app
        run: |
          rm -rf android
          flutter create --platforms=android .
          
          # 1. Ubah minSdk ke 26
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' android/app/build.gradle.kts
          
          # 2. SUNTIKAN UTAMA: Aktifkan fitur desugaring dengan sintaks Kotlin (isCoreLibraryDesugaringEnabled)
          sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          
          # 3. SUNTIKAN UTAMA: Tambahkan library desugar_jdk_libs dengan sintaks Kotlin ("...")
          echo "" >> android/app/build.gradle.kts
          echo "dependencies {" >> android/app/build.gradle.kts
          echo "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")" >> android/app/build.gradle.kts
          echo "}" >> android/app/build.gradle.kts

      - name: Get Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Code
        working-directory: mobile_app
        run: flutter analyze || true

      - name: Build APK (Split per ABI)
        working-directory: mobile_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: mobile_app/build/app/outputs/flutter-apk/app-*-release.apk
