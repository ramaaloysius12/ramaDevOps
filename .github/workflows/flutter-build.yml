name: Flutter CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Konfigurasi Android & Desugaring
        working-directory: mobile_app
        run: |
          # 1. Buat folder android bawaan pabrik Flutter
          rm -rf android
          flutter create --platforms=android .

          # 2. Selesaikan masalah SDK untuk flutter_local_notifications (min 26) dan file_picker (compile 36)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts

          # 3. Selesaikan masalah Desugaring dengan sangat rapi (disisipkan tepat di bawah targetCompatibility)
          sed -i '/targetCompatibility = JavaVersion.VERSION_1_8/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
          
          # 4. Tambahkan dependensi desugar di baris paling akhir file
          echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts

      - name: Get Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Code
        working-directory: mobile_app
        run: flutter analyze || true

      - name: Build APK (Split per ABI)
        working-directory: mobile_app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: mobile_app/build/app/outputs/flutter-apk/app-*-release.apk
